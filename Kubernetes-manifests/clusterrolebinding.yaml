apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: employment-management-clusterrolebinding

subjects:
  - kind: ServiceAccount
    name: default
    namespace: stateful-demo

roleRef:
  kind: ClusterRole
  name: employment-management-cluster-role
  apiGroup: rbac.authorization.k8s.io