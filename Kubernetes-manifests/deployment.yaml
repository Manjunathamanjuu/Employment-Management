apiVersion: apps/v1
kind: Deployment

metadata:
  name: employment-management
  namespace: stateful-demo
  labels:
    app: employment-management

spec:
  replicas: 1

  selector:
    matchLabels:
      app: employment-management

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: employment-management

    spec:
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: employment-management

          image: us-central1-docker.pkg.dev/project-7e1069a7-5b78-49e8-9b8/quickstart-docker-repo/employment-management:1.0.0

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
<<<<<<< HEAD
              containerPort: 8180
=======
              containerPort: 8180
              protocol: TCP
>>>>>>> upstream/feature/Employment-Management

          # PostgreSQL configuration
          env:
            - name: POSTGRES_HOST
              value: postgres

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_PORT

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          # Container-level security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          # Resource configuration
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Startup probe
          startupProbe:
            httpGet:
              path: /api/employees
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/employees
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/employees
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
