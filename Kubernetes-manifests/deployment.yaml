apiVersion: apps/v1
kind: Deployment

metadata:
  name: employment-management
  namespace: stateful-demo
  labels:
    app: employment-management

spec:
  replicas: 1

  selector:
    matchLabels:
      app: employment-management

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: employment-management

    spec:
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: employment-management

          image: us-central1-docker.pkg.dev/gcp-dev-july-2026/employment-management/employment-management:3.0.0

          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080

          # PostgreSQL configuration from ConfigMap and Secret
          env:

            # PostgreSQL Service/Host
            - name: POSTGRES_HOST
              value: postgres

            # PostgreSQL Database
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB

            # PostgreSQL User
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER

            # PostgreSQL Port
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_PORT

            # PostgreSQL Password from Secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          # ============================================================
          # Persistent storage mount - COMMENTED FOR NOW
          # Uncomment this section when employment-management-pvc exists
          # ============================================================

          # volumeMounts:
          #   - name: application-data
          #     mountPath: /app/data

          # Container-level security context
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          # Resource configuration
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Startup probe
          startupProbe:
            httpGet:
              path: /api/employees
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/employees
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/employees
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

      # ================================================================
      # PersistentVolumeClaim - COMMENTED FOR NOW
      # Uncomment when employment-management-pvc is created
      # ================================================================

      # volumes:
      #   - name: application-data
      #     persistentVolumeClaim:
      #       claimName: employment-management-pvc