# Source: employment-management/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: employment-management-postgres
  namespace: default
  labels:
    helm.sh/chart: employment-management-0.1.0
    app.kubernetes.io/name: employment-management
    app.kubernetes.io/instance: employment-management
    app.kubernetes.io/version: "3.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: employment-management-postgres
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: employment-management-postgres
      app.kubernetes.io/instance: employment-management

  template:
    metadata:
      labels:
        app.kubernetes.io/name: employment-management-postgres
        app.kubernetes.io/instance: employment-management

    spec:
      securityContext:
        fsGroup: 999

      containers:
        - name: postgres
          image: "postgres:18"
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: employment-management-postgres
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: employment-management-postgres
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employment-management-postgres
                  key: POSTGRES_PASSWORD

          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard-rwo
        resources:
          requests:
            storage: 5Gi
