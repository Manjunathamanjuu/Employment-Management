# Source: employment-management/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: employment-management-employment-management
  namespace: default
  labels:
    helm.sh/chart: employment-management-0.1.0
    app.kubernetes.io/name: employment-management
    app.kubernetes.io/instance: employment-management
    app.kubernetes.io/version: "3.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: employment-management
      app.kubernetes.io/instance: employment-management

  template:
    metadata:
      labels:
        app.kubernetes.io/name: employment-management
        app.kubernetes.io/instance: employment-management

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: employment-management
          image: "us-central1-docker.pkg.dev/gcp-dev-july-2026/employment-management/employment-management:3.0.0"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8180
              protocol: TCP

          env:
            - name: POSTGRES_HOST
              value: "employment-management-postgres"

            - name: POSTGRES_PORT
              value: "5432"

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: employment-management-postgres
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: employment-management-postgres
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: employment-management-postgres
                  key: POSTGRES_PASSWORD

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi

          startupProbe:
            httpGet:
              path: /api/employees
              port: 8180
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/employees
              port: 8180
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /api/employees
              port: 8180
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
