apiVersion: apps/v1
kind: Deployment
metadata:
  name: employment-management-tomcat
  namespace: default
  labels:
    app.kubernetes.io/instance: employment-management
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: tomcat
    app.kubernetes.io/version: 11.0.26
    helm.sh/chart: tomcat-13.6.26
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: employment-management
      app.kubernetes.io/name: tomcat
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: employment-management
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: tomcat
        app.kubernetes.io/version: 11.0.26
        helm.sh/chart: tomcat-13.6.26
    spec:
      
      automountServiceAccountToken: false
      affinity:
        podAffinity:
          
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: employment-management
                    app.kubernetes.io/name: tomcat
                topologyKey: kubernetes.io/hostname
              weight: 1
        nodeAffinity:
          
      serviceAccountName: employment-management-tomcat
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
        supplementalGroups: []
        sysctls: []
      initContainers:
      containers:
        - name: tomcat
          image: registry-1.docker.io/bitnami/tomcat:latest
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions: {}
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: BITNAMI_DEBUG
              value: "false"
            - name: TOMCAT_USERNAME_FILE
              value: /opt/bitnami/tomcat/secrets/tomcat-username
            - name: TOMCAT_PASSWORD_FILE
              value: /opt/bitnami/tomcat/secrets/tomcat-password
            - name: OPENSSL_FIPS
              value: "yes"
            - name: JAVA_TOOL_OPTIONS
              value: "--module-path=/opt/bitnami/bc-fips/ -Djava.security.properties==/opt/bitnami/java/conf/security/java.security.restricted"
            - name: TOMCAT_INSTALL_DEFAULT_WEBAPPS
              value: "no"
            - name: TOMCAT_ALLOW_REMOTE_MANAGEMENT
              value: "no"
            - name: TOMCAT_HTTP_PORT_NUMBER
              value: "8180"
          ports:
            - name: http
              containerPort: 8180
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 6
            initialDelaySeconds: 120
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 3
            initialDelaySeconds: 30
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 380m
              ephemeral-storage: 2Gi
              memory: 384Mi
            requests:
              cpu: 250m
              ephemeral-storage: 50Mi
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /bitnami/tomcat
            - name: empty-dir
              mountPath: /opt/bitnami/tomcat/temp
              subPath: app-tmp-dir
            - name: empty-dir
              mountPath: /opt/bitnami/tomcat/conf
              subPath: app-conf-dir
            - name: empty-dir
              mountPath: /opt/bitnami/tomcat/logs
              subPath: app-logs-dir
            - name: empty-dir
              mountPath: /opt/bitnami/tomcat/work
              subPath: app-work-dir
            - name: empty-dir
              mountPath: /tmp
              subPath: tmp-dir
            - name: tomcat-secrets
              mountPath: /opt/bitnami/tomcat/secrets
      volumes:
        - name: empty-dir
          emptyDir: {}
        - name: tomcat-secrets
          projected:
            sources:
              - secret:
                  name: employment-management-tomcat
        - name: data
          persistentVolumeClaim:
            claimName: employment-management-tomcat

