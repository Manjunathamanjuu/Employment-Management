apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "employment-management.postgresName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "employment-management.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "employment-management.postgresName" . }}
  replicas: {{ .Values.postgres.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "employment-management.postgresName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "employment-management.postgresName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      securityContext:
        fsGroup: 999

      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}

          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}

          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ include "employment-management.postgresName" . }}
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "employment-management.postgresName" . }}
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "employment-management.postgresName" . }}
                  key: POSTGRES_PASSWORD

          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.postgres.storage.className }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}