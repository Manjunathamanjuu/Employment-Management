services:
  postgres:
    image: postgres:16-alpine
    container_name: employment-management-postgres
    environment:
      POSTGRES_DB: employee-managementdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee-managementdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  employment-management:
    build:
      context: .
      dockerfile: Dockerfile
    image: employment-management:latest
    container_name: employment-management
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: employee-managementdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
